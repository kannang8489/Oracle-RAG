# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── File Upload Limits ───────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Oracle ADB Wallet (loaded from .env via OracleDBUtils) ──────────────────
# DB_TNS_ALIAS, DB_WALLET_DIR, DB_23AI_USERNAME, DB_23AI_PASSWORD
# are read from the .env file at the project root — see .env.example

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.oracle.dev.jdbc.langchain4j=INFO
logging.level.oracle.ucp=WARN
